name: Semgrep

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Curated security packs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan tracked source
        run: >-
          semgrep scan .
          --metrics=off
          --error
          --severity=ERROR
          --config=p/security-audit
          --config=p/secrets
          --config=p/owasp-top-ten
          --config=p/cwe-top-25
          --config=p/gitleaks
          --sarif-output=semgrep.sarif
      - name: Upload SARIF
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
